version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai-checklist-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-checklist-network

  backend:
    build:
      context: ./backend
    container_name: ai-checklist-backend
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ai-checklist?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_in_production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - ai-checklist-network
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
    container_name: ai-checklist-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - ai-checklist-network
    volumes:
      - ./frontend/src:/app/src

volumes:
  mongodb_data:

networks:
  ai-checklist-network:
    driver: bridge
